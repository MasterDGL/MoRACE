name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install core and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Verify repository integrity
        run: python scripts/verify_repository.py

      - name: Run tests
        run: python -m pytest

      - name: Run CPU rule example
        run: python examples/compile_rules.py

      - name: Compile Python sources
        run: python -m compileall -q morace scripts tests examples

      - name: Check shell entrypoints
        run: |
          bash -n scripts/run_pipeline.sh
          bash -n scripts/setup_environment.sh

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist
